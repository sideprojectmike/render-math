<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE</title>
<!-- KaTeX for math, Plotly for interactive graphs (both from jsDelivr CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  body { font: 17px/1.6 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.6em; } .katex-display { overflow-x: auto; padding: 4px 0; }
  .plot { width: 100%; height: 420px; margin: 16px 0; }
  .step { border-left: 3px solid #4a7dff; padding-left: 14px; margin: 18px 0; }
  @media (prefers-color-scheme: dark) { body { background: #16171a; color: #e8e8e8; } }
</style>
</head>
<body>
<h1>TITLE</h1>

<!-- Write math with \( inline \) and \[ display \] or $$ display $$. -->
<div class="step">
  <p>For \( f(x) = x^2 - 2x \), the derivative is</p>
  \[ f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h} = 2x - 2. \]
</div>

<!-- One div per graph; fill FUNCS below. -->
<div id="plot1" class="plot"></div>

<script>
// Each entry: [label, function of x]. Edit range as needed.
const FUNCS = [["f(x) = x² − 2x", x => x*x - 2*x], ["f′(x) = 2x − 2", x => 2*x - 2]];
const XMIN = -3, XMAX = 5, N = 800;

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const xs = Array.from({length: N}, (_, i) => XMIN + (XMAX - XMIN) * i / (N - 1));
Plotly.newPlot("plot1", FUNCS.map(([name, f]) => ({
  x: xs, y: xs.map(x => { const y = f(x); return Number.isFinite(y) ? y : null; }),
  name, mode: "lines", line: {width: 2.5}
})), {
  margin: {t: 20, r: 20, b: 40, l: 50}, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
  font: {color: dark ? "#e8e8e8" : "#1a1a1a"},
  xaxis: {zeroline: true, gridcolor: dark ? "#333" : "#eee"}, yaxis: {zeroline: true, gridcolor: dark ? "#333" : "#eee"},
  legend: {orientation: "h", y: -0.15}
}, {responsive: true, displaylogo: false});

document.addEventListener("DOMContentLoaded", () => renderMathInElement(document.body, {
  delimiters: [{left: "$$", right: "$$", display: true}, {left: "\\[", right: "\\]", display: true},
               {left: "\\(", right: "\\)", display: false}],
  throwOnError: false
}));
</script>
</body>
</html>
